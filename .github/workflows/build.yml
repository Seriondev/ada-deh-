name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Generate project files
        run: |
          cat > settings.gradle <<'TS_EOF_0'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'transparent-skin'
          TS_EOF_0
          cat > build.gradle <<'TS_EOF_1'
          plugins {
              id 'fabric-loom' version '1.11-SNAPSHOT'
          }

          version = '1.0.0'
          group = 'com.vizkovico'

          base {
              archivesName = 'transparent-skin'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21.10"
              mappings "net.fabricmc:yarn:1.21.10+build.3:v2"
              modImplementation "net.fabricmc:fabric-loader:0.17.2"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          TS_EOF_1
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'TS_EOF_2'
          {
            "schemaVersion": 1,
            "id": "transparentskin",
            "version": "${version}",
            "name": "Transparent Skin",
            "description": "Bikin skin player transparan (opacity bisa diatur), outer layer tetap kelihatan, dan bagian badan bisa dimatikan satu per satu. Buka menu dengan /ts",
            "authors": ["Anonymous"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.vizkovico.transparentskin.TransparentSkinMod"]
            },
            "mixins": ["transparentskin.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "1.21.10",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          TS_EOF_2
          mkdir -p src/main/resources
          cat > src/main/resources/transparentskin.mixins.json <<'TS_EOF_3'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.vizkovico.transparentskin.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [],
            "client": [
              "ModelPartMixin",
              "PlayerEntityModelMixin"
            ],
            "injectors": {
              "defaultRequire": 0
            }
          }
          TS_EOF_3
          mkdir -p src/main/java/com/vizkovico/transparentskin
          cat > src/main/java/com/vizkovico/transparentskin/TransparentSkinMod.java <<'TS_EOF_4'
          package com.vizkovico.transparentskin;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientChunkEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.block.Block;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.Blocks;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.world.ClientWorld;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.ChunkPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.world.Heightmap;
          import net.minecraft.world.chunk.Chunk;
          import net.minecraft.world.chunk.ChunkStatus;
          import net.minecraft.world.chunk.WorldChunk;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.client.model.ModelPart;
          import net.minecraft.text.Text;

          import java.io.Reader;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Map;
          import java.util.Set;
          import java.util.function.IntConsumer;

          public class TransparentSkinMod implements ClientModInitializer {

              private static boolean openRequested = false;

              @Override
              public void onInitializeClient() {
                  Config.load();

                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) -> {
                      String[] names = {"ts", "tskin"};
                      for (String name : names) {
                          dispatcher.register(
                                  ClientCommandManager.literal(name)
                                          .executes(ctx -> {
                                              openRequested = true;
                                              return 1;
                                          })
                                          .then(ClientCommandManager.literal("toggle").executes(ctx -> {
                                              Config c = Config.get();
                                              c.enabled = !c.enabled;
                                              Config.save();
                                              ctx.getSource().sendFeedback(Text.literal("Skin transparan: " + (c.enabled ? "ON" : "OFF")));
                                              return 1;
                                          }))
                          );
                      }
                  });

                  // GUI dibuka di tick berikutnya, supaya tidak langsung ketutup oleh chat screen
                  ClientChunkEvents.CHUNK_LOAD.register((world, chunk) -> {
                      try {
                          SnowManager.onChunkLoad(world, chunk);
                      } catch (Throwable ignored) {
                      }
                  });
                  ClientChunkEvents.CHUNK_UNLOAD.register((world, chunk) -> SnowManager.onChunkUnload(chunk));
                  ClientPlayConnectionEvents.DISCONNECT.register((handler, client) -> SnowManager.reset());

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      try {
                          SnowManager.tick(client);
                      } catch (Throwable ignored) {
                      }
                      if (openRequested) {
                          openRequested = false;
                          client.setScreen(new ConfigScreen(null));
                      }
                  });
              }

              // ------------------------------------------------------------------
              // Interface yang ditempel ke ModelPart lewat mixin (menyimpan "peran" part)
              // role 1..6   = base layer: kepala, badan, tangan kanan, tangan kiri, kaki kanan, kaki kiri
              // role 11..16 = outer layer: hat, jacket, lengan kanan, lengan kiri, celana kanan, celana kiri
              // ------------------------------------------------------------------
              public interface Part {
                  int ts$getRole();

                  void ts$setRole(int role);
              }

              // ------------------------------------------------------------------
              // Config
              // ------------------------------------------------------------------
              public static final class Config {
                  public boolean enabled = true;
                  public boolean everyone = false;
                  public boolean snow = true;
                  public boolean footprints = true;
                  public int baseOpacity = 40;
                  public int outerOpacity = 100;
                  public boolean[] hideBase = new boolean[6];
                  public boolean[] hideOuter = new boolean[6];

                  private static Config instance = new Config();
                  private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

                  public static Config get() {
                      return instance;
                  }

                  private static Path file() {
                      return FabricLoader.getInstance().getConfigDir().resolve("transparent-skin.json");
                  }

                  public static void load() {
                      try {
                          Path p = file();
                          if (Files.exists(p)) {
                              try (Reader r = Files.newBufferedReader(p, StandardCharsets.UTF_8)) {
                                  Config c = GSON.fromJson(r, Config.class);
                                  if (c != null) {
                                      instance = c;
                                  }
                              }
                          }
                      } catch (Throwable t) {
                          instance = new Config();
                      }
                      instance.sanitize();
                  }

                  public static void save() {
                      try {
                          Files.writeString(file(), GSON.toJson(instance), StandardCharsets.UTF_8);
                      } catch (Throwable ignored) {
                      }
                  }

                  private void sanitize() {
                      baseOpacity = Math.max(0, Math.min(100, baseOpacity));
                      outerOpacity = Math.max(0, Math.min(100, outerOpacity));
                      if (hideBase == null || hideBase.length != 6) {
                          hideBase = new boolean[6];
                      }
                      if (hideOuter == null || hideOuter.length != 6) {
                          hideOuter = new boolean[6];
                      }
                  }
              }

              // ------------------------------------------------------------------
              // State (dipakai oleh mixin saat render)
              // ------------------------------------------------------------------
              public static final class State {
                  /** true kalau model yang sedang dirender memang boleh dipengaruhi mod ini */
                  public static boolean active = false;
                  public static int angleHits = 0;
                  public static int partHits = 0;

                  private State() {
                  }

                  public static void tag(ModelPart part, int role) {
                      if (part != null) {
                          ((Part) (Object) part).ts$setRole(role);
                      }
                  }

                  public static boolean effective() {
                      Config c = Config.get();
                      if (!c.enabled || !active) {
                          return false;
                      }
                      if (!c.everyone) {
                          // mode "diri sendiri": tangan first-person tidak ikut diubah
                          MinecraftClient mc = MinecraftClient.getInstance();
                          if (mc != null && mc.currentScreen == null && mc.options != null
                                  && mc.options.getPerspective().isFirstPerson()) {
                              return false;
                          }
                      }
                      return true;
                  }

                  public static boolean isHidden(int role) {
                      if (partHits < 1000000) {
                          partHits++;
                      }
                      if (!effective()) {
                          return false;
                      }
                      Config c = Config.get();
                      if (role >= 1 && role <= 6) {
                          return c.hideBase[role - 1];
                      }
                      if (role >= 11 && role <= 16) {
                          return c.hideOuter[role - 11];
                      }
                      return false;
                  }

                  public static int tint(int role, int color) {
                      if (!effective()) {
                          return color;
                      }
                      Config c = Config.get();
                      int pct = role < 10 ? c.baseOpacity : c.outerOpacity;
                      if (pct >= 100) {
                          return color;
                      }
                      int origAlpha = color >>> 24;
                      if (origAlpha == 0) {
                          return color;
                      }
                      int alpha = origAlpha * Math.max(0, pct) / 100;
                      return (alpha << 24) | (color & 0x00FFFFFF);
                  }
              }


              // ------------------------------------------------------------------
              // Salju client-side: block solid di permukaan ditutup snow layer (visual saja)
              // ------------------------------------------------------------------
              public static final class SnowManager {
                  private static final Map<Long, Set<Long>> PLACED = new HashMap<>();
                  private static Boolean applied = null;
                  private static Set<Block> excluded = null;

                  private SnowManager() {
                  }

                  private static Set<Block> excluded() {
                      if (excluded == null) {
                          Set<Block> set = new HashSet<>();
                          set.add(Blocks.CRAFTING_TABLE);
                          set.add(Blocks.SMITHING_TABLE);
                          set.add(Blocks.CARTOGRAPHY_TABLE);
                          set.add(Blocks.FLETCHING_TABLE);
                          set.add(Blocks.LOOM);
                          set.add(Blocks.COMPOSTER);
                          set.add(Blocks.GRINDSTONE);
                          set.add(Blocks.STONECUTTER);
                          set.add(Blocks.LECTERN);
                          set.add(Blocks.BARREL);
                          set.add(Blocks.FURNACE);
                          set.add(Blocks.BLAST_FURNACE);
                          set.add(Blocks.SMOKER);
                          set.add(Blocks.ANVIL);
                          set.add(Blocks.ENCHANTING_TABLE);
                          set.add(Blocks.BREWING_STAND);
                          set.add(Blocks.SNOW);
                          set.add(Blocks.SNOW_BLOCK);
                          set.add(Blocks.POWDER_SNOW);
                          excluded = set;
                      }
                      return excluded;
                  }

                  public static void reset() {
                      PLACED.clear();
                      applied = null;
                  }

                  public static void onChunkUnload(WorldChunk chunk) {
                      PLACED.remove(chunk.getPos().toLong());
                  }

                  public static void onChunkLoad(ClientWorld world, WorldChunk chunk) {
                      PLACED.remove(chunk.getPos().toLong());
                      if (Config.get().snow) {
                          cover(world, chunk);
                      }
                  }

                  private static boolean eligible(ClientWorld world, BlockPos pos, BlockState ground) {
                      if (ground.isAir() || ground.hasBlockEntity()) {
                          return false;
                      }
                      if (excluded().contains(ground.getBlock())) {
                          return false;
                      }
                      return ground.isSideSolidFullSquare(world, pos, Direction.UP);
                  }

                  private static void cover(ClientWorld world, WorldChunk chunk) {
                      ChunkPos cp = chunk.getPos();
                      Set<Long> set = PLACED.computeIfAbsent(cp.toLong(), k -> new HashSet<>());
                      BlockPos.Mutable pos = new BlockPos.Mutable();
                      for (int x = 0; x < 16; x++) {
                          for (int z = 0; z < 16; z++) {
                              int wx = cp.getStartX() + x;
                              int wz = cp.getStartZ() + z;
                              int groundY = chunk.sampleHeightmap(Heightmap.Type.MOTION_BLOCKING, x, z) - 1;
                              if (!world.isInHeightLimit(groundY) || !world.isInHeightLimit(groundY + 1)) {
                                  continue;
                              }
                              pos.set(wx, groundY, wz);
                              BlockState ground = world.getBlockState(pos);
                              if (!eligible(world, pos, ground)) {
                                  continue;
                              }
                              pos.set(wx, groundY + 1, wz);
                              BlockState above = world.getBlockState(pos);
                              boolean free = above.isAir() || (above.isReplaceable() && above.getFluidState().isEmpty());
                              if (!free) {
                                  continue;
                              }
                              world.setBlockState(pos, Blocks.SNOW.getDefaultState(), Block.NOTIFY_LISTENERS);
                              set.add(pos.asLong());
                          }
                      }
                  }

                  private static void coverAll(MinecraftClient client, ClientWorld world, ClientPlayerEntity player) {
                      int r = 16;
                      ChunkPos pc = player.getChunkPos();
                      for (int cx = pc.x - r; cx <= pc.x + r; cx++) {
                          for (int cz = pc.z - r; cz <= pc.z + r; cz++) {
                              Chunk ch = world.getChunk(cx, cz, ChunkStatus.FULL, false);
                              if (ch instanceof WorldChunk wc) {
                                  cover(world, wc);
                              }
                          }
                      }
                  }

                  private static void uncoverAll(ClientWorld world) {
                      for (Set<Long> set : PLACED.values()) {
                          for (long l : set) {
                              BlockPos bp = BlockPos.fromLong(l);
                              if (world.getBlockState(bp).isOf(Blocks.SNOW)) {
                                  world.setBlockState(bp, Blocks.AIR.getDefaultState(), Block.NOTIFY_LISTENERS);
                              }
                          }
                      }
                      PLACED.clear();
                  }

                  public static void tick(MinecraftClient client) {
                      ClientWorld world = client.world;
                      ClientPlayerEntity player = client.player;
                      if (world == null || player == null) {
                          return;
                      }
                      Config c = Config.get();
                      if (applied == null) {
                          applied = c.snow;
                      }
                      if (applied != c.snow) {
                          applied = c.snow;
                          if (c.snow) {
                              coverAll(client, world, player);
                          } else {
                              uncoverAll(world);
                          }
                      }
                      if (!c.snow || !c.footprints || !player.isOnGround()) {
                          return;
                      }
                      BlockPos feet = player.getBlockPos();
                      Set<Long> set = PLACED.get(new ChunkPos(feet).toLong());
                      if (set != null && set.contains(feet.asLong()) && world.getBlockState(feet).isOf(Blocks.SNOW)) {
                          world.setBlockState(feet, Blocks.AIR.getDefaultState(), Block.NOTIFY_LISTENERS);
                          set.remove(feet.asLong());
                      }
                  }
              }

              // ------------------------------------------------------------------
              // GUI
              // ------------------------------------------------------------------
              public static final class ConfigScreen extends Screen {
                  private static final String[] BASE_NAMES = {"Kepala", "Badan", "Tangan kanan", "Tangan kiri", "Kaki kanan", "Kaki kiri"};
                  private static final String[] OUTER_NAMES = {"Hat", "Jacket", "Lengan kanan", "Lengan kiri", "Celana kanan", "Celana kiri"};

                  private final Screen parent;
                  private int page = 0;
                  private int headerY = 20;
                  private int leftCenterX = 0;
                  private int rightCenterX = 0;

                  public ConfigScreen(Screen parent) {
                      super(Text.literal("Skin Transparan"));
                      this.parent = parent;
                  }

                  @Override
                  protected void init() {
                      if (page == 0) {
                          initMain();
                      } else {
                          initParts();
                      }
                  }

                  private void initMain() {
                      Config c = Config.get();
                      int w = Math.min(210, this.width - 20);
                      int x = (this.width - w) / 2;
                      int y = Math.max(28, (this.height - 170) / 2);

                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal("Skin transparan: " + (c.enabled ? "ON" : "OFF")),
                              b -> {
                                  c.enabled = !c.enabled;
                                  b.setMessage(Text.literal("Skin transparan: " + (c.enabled ? "ON" : "OFF")));
                              }).dimensions(x, y, w, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal("Berlaku untuk: " + (c.everyone ? "Semua pemain" : "Diri sendiri")),
                              b -> {
                                  c.everyone = !c.everyone;
                                  b.setMessage(Text.literal("Berlaku untuk: " + (c.everyone ? "Semua pemain" : "Diri sendiri")));
                              }).dimensions(x, y + 24, w, 20).build());

                      this.addDrawableChild(new OpacitySlider(x, y + 48, w, 20, "Opacity base layer", c.baseOpacity, v -> c.baseOpacity = v));
                      this.addDrawableChild(new OpacitySlider(x, y + 72, w, 20, "Opacity outer layer", c.outerOpacity, v -> c.outerOpacity = v));

                      int hw = (w - 4) / 2;
                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal("Salju: " + (c.snow ? "ON" : "OFF")),
                              b -> {
                                  c.snow = !c.snow;
                                  b.setMessage(Text.literal("Salju: " + (c.snow ? "ON" : "OFF")));
                              }).dimensions(x, y + 96, hw, 20).build());
                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal("Jejak: " + (c.footprints ? "ON" : "OFF")),
                              b -> {
                                  c.footprints = !c.footprints;
                                  b.setMessage(Text.literal("Jejak: " + (c.footprints ? "ON" : "OFF")));
                              }).dimensions(x + hw + 4, y + 96, hw, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Atur bagian tubuh >"), b -> {
                          page = 1;
                          this.clearAndInit();
                      }).dimensions(x, y + 120, w, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Selesai"), b -> this.close())
                              .dimensions(x, y + 148, w, 20).build());
                  }

                  private void initParts() {
                      Config c = Config.get();
                      int gap = 10;
                      int cw = Math.min(150, (this.width - 30) / 2);
                      int lx = this.width / 2 - gap / 2 - cw;
                      int rx = this.width / 2 + gap / 2;
                      int y = Math.max(34, (this.height - 176) / 2 + 6);

                      this.headerY = y - 12;
                      this.leftCenterX = lx + cw / 2;
                      this.rightCenterX = rx + cw / 2;

                      for (int i = 0; i < 6; i++) {
                          addPartButton(lx, y + i * 22, cw, BASE_NAMES[i], c.hideBase, i);
                          addPartButton(rx, y + i * 22, cw, OUTER_NAMES[i], c.hideOuter, i);
                      }

                      int w = Math.min(210, this.width - 20);
                      int x = (this.width - w) / 2;
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("< Kembali"), b -> {
                          page = 0;
                          this.clearAndInit();
                      }).dimensions(x, y + 6 * 22 + 4, w, 20).build());
                  }

                  private void addPartButton(int x, int y, int w, String name, boolean[] hideArray, int index) {
                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal(partLabel(name, hideArray[index])),
                              b -> {
                                  hideArray[index] = !hideArray[index];
                                  b.setMessage(Text.literal(partLabel(name, hideArray[index])));
                              }).dimensions(x, y, w, 20).build());
                  }

                  private static String partLabel(String name, boolean hidden) {
                      return name + ": " + (hidden ? "Hilang" : "Tampil");
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                      // sengaja kosong: dunia tetap kelihatan jelas (tekan F5 untuk lihat karakter sendiri)
                  }

                  @Override
                  public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                      super.render(context, mouseX, mouseY, delta);
                      context.drawCenteredTextWithShadow(this.textRenderer, this.title, this.width / 2, 10, 0xFFFFFFFF);

                      if (page == 1) {
                          context.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Base layer"), leftCenterX, headerY, 0xFFFFFFFF);
                          context.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Outer layer"), rightCenterX, headerY, 0xFFFFFFFF);
                      } else {
                          String status = "Hook: model " + (State.angleHits > 0 ? "OK" : "-") + ", part " + (State.partHits > 0 ? "OK" : "-");
                          context.drawCenteredTextWithShadow(this.textRenderer, Text.literal(status), this.width / 2, this.height - 12, 0xFFAAAAAA);
                      }
                  }

                  @Override
                  public boolean shouldPause() {
                      return false;
                  }

                  @Override
                  public void close() {
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }

                  @Override
                  public void removed() {
                      Config.save();
                      super.removed();
                  }
              }

              // ------------------------------------------------------------------
              // Slider opacity (0 - 100 %)
              // ------------------------------------------------------------------
              private static final class OpacitySlider extends SliderWidget {
                  private final String label;
                  private final IntConsumer setter;

                  OpacitySlider(int x, int y, int width, int height, String label, int percent, IntConsumer setter) {
                      super(x, y, width, height, Text.empty(), percent / 100.0);
                      this.label = label;
                      this.setter = setter;
                      this.updateMessage();
                  }

                  @Override
                  protected void updateMessage() {
                      String l = this.label == null ? "" : this.label;
                      this.setMessage(Text.literal(l + ": " + (int) Math.round(this.value * 100.0) + "%"));
                  }

                  @Override
                  protected void applyValue() {
                      if (this.setter != null) {
                          this.setter.accept((int) Math.round(this.value * 100.0));
                      }
                  }
              }
          }
          TS_EOF_4
          mkdir -p src/main/java/com/vizkovico/transparentskin/mixin
          cat > src/main/java/com/vizkovico/transparentskin/mixin/ModelPartMixin.java <<'TS_EOF_5'
          package com.vizkovico.transparentskin.mixin;

          import com.vizkovico.transparentskin.TransparentSkinMod;
          import net.minecraft.client.model.ModelPart;
          import net.minecraft.client.render.VertexConsumer;
          import net.minecraft.client.util.math.MatrixStack;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;
          import org.spongepowered.asm.mixin.Unique;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(ModelPart.class)
          public abstract class ModelPartMixin implements TransparentSkinMod.Part {

              @Shadow
              public boolean hidden;

              @Unique
              private int ts$role = 0;

              @Unique
              private boolean ts$weHid = false;

              @Override
              public int ts$getRole() {
                  return this.ts$role;
              }

              @Override
              public void ts$setRole(int role) {
                  this.ts$role = role;
              }

              @Inject(
                      method = "render(Lnet/minecraft/client/util/math/MatrixStack;Lnet/minecraft/client/render/VertexConsumer;III)V",
                      at = @At("HEAD"),
                      require = 0
              )
              private void ts$beforeRender(MatrixStack matrices, VertexConsumer vertices, int light, int overlay, int color, CallbackInfo ci) {
                  int role = this.ts$role;
                  if (role == 0) {
                      return;
